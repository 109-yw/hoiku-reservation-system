
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一時預かり保育予約システム</title>

    <style>
        body {
            font-family: "Meiryo", sans-serif;
            background-color: #fff8f5;

        }

        header {
            background-color: #f8d9d9;
            padding: 30px;
        }

        h1 {
            color: #554444;
        }

        .container {
            width: 80%;
            max-width: 700px;
            margin: 40px auto;
        }

        .menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }

        .menu a {
            display: block;
            background-color: white;
            padding: 30px 10px;
            border-radius: 12px;
            text-decoration: none;
            color: #554444;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 2px 8px #dddddd;
        }

        .menu a:hover {
            background-color: #ffe5e5;
        }

        footer {
            margin-top: 50px;
            color: #888888;
        }

        @media (max-width: 500px) {
            .menu {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>
