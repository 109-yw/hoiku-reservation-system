
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ログイン</title>

<style>
body {
    font-family: sans-serif;
    background: #f0f6fa;
    margin: 0;
}

header {
    background: #78b5d6;
    color: white;
    text-align: center;
    padding: 25px;
}

.container {
    max-width: 450px;
    margin: 50px auto;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 15px #0001;
}

h2 {
    text-align: center;
}

label {
    display: block;
    margin-top: 15px;
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 5px;
    border: 1px solid #ccc;
    border-radius: 6px;
    box-sizing: border-box;
}

.submit {
    width: 100%;
    padding: 15px;
    margin-top: 25px;
    background: #78b5d6;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.2s;
}

.submit:hover {
    background: #559ac2;
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 5px 12px #0002;
}

.back {
    display: block;
    text-align: center;
    margin-top: 25px;
    color: #559ac2;
}
</style>
</head>

<body>

<header>
    <h1>一時保育予約システム</h1>
    <p>ログイン</p>
</header>

<div class="container">

    <h2>ログイン</h2>

    <form onsubmit="login(event)">
        <label for="email">メールアドレス</label>
        <input type="email" id="email" name="email" required>

        <label for="password">パスワード</label>
        <input type="password" id="password"
               name="password" required>

        <button type="submit" class="submit">
            ログイン
        </button>
    </form>

    <a href="hoiku.html" class="back">
        トップページに戻る
    </a>

</div>

<script>
// ログイン処理（仮）
function login(event) {
    event.preventDefault();

    alert("ログイン機能は現在準備中です。");
}
</script>

</body>
</html>
