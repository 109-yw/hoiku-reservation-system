
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ログイン</title>

<style>
body {
    font-family: sans-serif;
    background: #f0f6fa;
    margin: 0;
}

header {
    background: #78b5d6;
    color: white;
    text-align: center;
    padding: 25px;
}

.container {
    max-width: 450px;
    margin: 50px auto;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 15px #0001;
}

h2 {
    text-align: center;
}

label {
    display: block;
    margin-top: 15px;
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 5px;
    border: 1px solid #ccc;
    border-radius: 6px;
    box-sizing: border-box;
}

.submit {
    width: 100%;
    padding: 15px;
    margin-top: 25px;
    background: #78b5d6;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.2s;
}

.submit:hover {
    background: #559ac2;
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 5px 12px #0002;
}

.back {
    display: block;
    text-align: center;
    margin-top: 25px;
    color: #559ac2;
}

.message {
    padding: 10px;
    border-radius: 6px;
    margin: 15px 0;
}

.message.error {
    color: #8b0000;
    background: #ffe8e8;
}

.message.success {
    color: #155724;
    background: #e6f4ea;
}

.register {
    margin-top: 25px;
    border-top: 1px solid #ddd;
    padding-top: 15px;
}
</style>
</head>

<body>

<header>
    <h1>一時保育予約システム</h1>
    <p>ログイン</p>
</header>

<div class="container">

    <h2>ログイン</h2>

    {% for category, message in get_flashed_messages(with_categories=true) %}
    <p class="message {{ category }}" role="alert">{{ message }}</p>
    {% endfor %}

    <form action="/login" method="post">
        <label for="email">メールアドレス</label>
        <input type="email" id="email" name="email" autocomplete="email" required>

        <label for="password">パスワード</label>
        <input type="password" id="password"
               name="password" autocomplete="current-password" required>

        <button type="submit" class="submit">
            ログイン
        </button>
    </form>

    <section class="register">
        <h2>新規登録</h2>
        <form action="/register" method="post">
            <label for="registerName">保護者氏名</label>
            <input type="text" id="registerName" name="name"
                   autocomplete="name" required>

            <label for="phone">電話番号</label>
            <input type="tel" id="phone" name="phone"
                   autocomplete="tel" required>

            <label for="registerEmail">メールアドレス</label>
            <input type="email" id="registerEmail" name="email"
                   autocomplete="email" required>

            <label for="registerPassword">パスワード（8文字以上）</label>
            <input type="password" id="registerPassword" name="password"
                   minlength="8" autocomplete="new-password" required>

            <button type="submit" class="submit">新規登録</button>
        </form>
    </section>

    <a href="/" class="back">
        トップページに戻る
    </a>

</div>

</body>
</html>
