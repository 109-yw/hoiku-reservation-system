
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一時保育予約</title>

<style>
body {
    font-family: sans-serif;
    background: #f0f6fa;
    margin: 0;
}

header {
    background: #78b5d6;
    color: white;
    text-align: center;
    padding: 25px;
}

.container {
    max-width: 650px;
    margin: 30px auto;
    padding: 25px;
    background: white;
    border-radius: 12px;
}

.month {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

button {
    cursor: pointer;
    border: none;
    border-radius: 6px;
    padding: 10px 15px;
    background: #78b5d6;
    color: white;
}

button:hover {
    background: #559ac2;
}

.calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
}

.weekday {
    text-align: center;
    font-weight: bold;
    padding: 10px 0;
}

.day {
    min-height: 65px;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: white;
    color: #333;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    transition: 0.2s;
}

.day:hover:not(:disabled) {
    background: #dceefa;
    transform: translateY(-3px) scale(1.04);
    box-shadow: 0 4px 10px #0002;
}

.day.selected {
    background: #c5e5f7;
    border: 2px solid #559ac2;
}

.day:disabled {
    background: #f1f1f1;
    color: #aaa;
    cursor: not-allowed;
}

.status {
    font-size: 13px;
}

.open { color: green; }
.few { color: orange; }
.full { color: red; }
.closed { color: #777; }

.legend {
    text-align: center;
    margin: 20px 0;
}

.message {
    min-height: 1.5em;
    color: #333;
}

.message.error {
    color: #b00020;
}

.form-area {
    display: none;
    border-top: 1px solid #ddd;
    padding-top: 20px;
}

label {
    display: block;
    margin-top: 15px;
}

input, select {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    box-sizing: border-box;
}

.reserve {
    width: 100%;
    margin-top: 25px;
    padding: 15px;
}

.back {
    display: block;
    text-align: center;
    margin-top: 25px;
    color: #559ac2;
}
</style>
</head>

<body>

<header>
    <h1>一時保育予約システム</h1>
    <p>予約画面</p>
</header>

<div class="container">

    <h2>利用希望日を選択</h2>

    <div class="month">
        <button onclick="changeMonth(-1)">◀ 前月</button>
        <h2 id="monthTitle"></h2>
        <button onclick="changeMonth(1)">翌月 ▶</button>
        </div>

        <p id="calendarMessage" class="message" aria-live="polite"></p>
        <div class="calendar" id="calendar"></div>

        <div class="legend">
            <span class="open">○ 空きあり</span>　
            <span class="few">△ 残りわずか</span>　
            <span class="full">× 満員</span>　
            <span class="closed">休 開所情報なし・休所</span>
        </div>

    
<div class="form-area" id="formArea">

        <h2 id="selectedDate"></h2>
        <p>児童IDと利用時間を選択してください。</p>

        <form id="reservationForm">

            <label for="childId">児童ID</label>
            <input
    id="childId"
    type="text"
    inputmode="numeric"
    pattern="[0-9]+"
    placeholder="児童IDを入力してください"
    required
>
            

            <label for="time">利用時間</label>
            <select id="time" required>
                <option value="">選択してください</option>
                <option value="morning">9:00～13:00（午前）</option>
                <option value="afternoon">13:00～17:00（午後）</option>
                <option value="full_day">9:00～17:00（一日）</option>
            </select>

            <button type="submit" class="reserve">予約確定</button>

        </form>
        <p id="reservationMessage" class="message" aria-live="polite"></p>
        <button id="confirmButton" type="button" hidden>予約を確定</button>
        <button id="cancelButton" type="button" hidden>仮押さえを取消</button>
</div>


    <a href="hoiku.html" class="back">
        トップページに戻る
    </a>

</div>

<script>
const today = new Date();
today.setHours(0, 0, 0, 0);

let currentYear = today.getFullYear();
let currentMonth = today.getMonth();
let selectedDate = null;
let currentHoldId = null;
let reservationConfirmed = false;
let monthDays = new Map();
let calendarRequestId = 0;

// カレンダーを表示
async function renderCalendar() {
    const requestId = ++calendarRequestId;
    const year = currentYear;
    const month = currentMonth;
    const calendar = document.getElementById("calendar");
    calendar.innerHTML = "";

    document.getElementById("monthTitle").textContent =
        `${year}年${month + 1}月`;
    const calendarMessage = document.getElementById("calendarMessage");
    calendarMessage.textContent = "空き状況を読み込んでいます。";
    calendarMessage.classList.remove("error");

    const weekdays = ["日", "月", "火", "水", "木", "金", "土"];

    weekdays.forEach(w => {
        const div = document.createElement("div");
        div.className = "weekday";
        div.textContent = w;
        calendar.appendChild(div);
    });

    const firstDay = new Date(year, month, 1).getDay();

    for (let i = 0; i < firstDay; i++) {
        calendar.appendChild(document.createElement("div"));
    }

    try {
        const response = await fetch(
            `/api/availability/month?year=${year}&month=${month + 1}`
        );
        const result = await response.json();
        if (!response.ok) {
            throw new Error(result.error || "空き状況を取得できませんでした。");
        }
        if (requestId !== calendarRequestId) return;
        monthDays = new Map(result.days.map(day => [day.care_date, day]));
        calendarMessage.textContent = "";
    } catch (error) {
        if (requestId !== calendarRequestId) return;
        monthDays = new Map();
        calendarMessage.textContent =
            error.message || "空き状況を取得できませんでした。";
        calendarMessage.classList.add("error");
    }

    const lastDay = new Date(year, month + 1, 0).getDate();
    for (let day = 1; day <= lastDay; day++) {
        const date = new Date(year, month, day);
        const dateKey = [
            year,
            String(month + 1).padStart(2, "0"),
            String(day).padStart(2, "0")
        ].join("-");
        const dayInfo = monthDays.get(dateKey);
        const status = dayInfo ? dayInfo.status : "closed";

        const btn = document.createElement("button");
        btn.className = "day";
        btn.type = "button";

        const number = document.createElement("span");
        number.textContent = day;

        const mark = document.createElement("span");
        mark.className = "status " + status;
        mark.textContent = status === "full" ? "×" :
            status === "few" ? "△" :
            status === "open" ? "○" : "休";

        btn.appendChild(number);
        btn.appendChild(mark);

        if (date < today || !dayInfo || status === "closed" || status === "full"
                || currentHoldId !== null) {
            btn.disabled = true;
        } else {
            btn.onclick = () => selectDate(dateKey, btn);
        }

        calendar.appendChild(btn);
    }
}

// 月を切り替える
function changeMonth(value) {
    if (currentHoldId !== null) return;
    const date = new Date(currentYear, currentMonth + value, 1);
    currentYear = date.getFullYear();
    currentMonth = date.getMonth();

    selectedDate = null;
    document.getElementById("formArea").style.display = "none";
    document.getElementById("reservationForm").reset();
    document.getElementById("reservationMessage").textContent = "";

    renderCalendar();
}

// 日付を選択
function selectDate(dateKey, button) {
    document.querySelectorAll(".day").forEach(btn => {
        btn.classList.remove("selected");
    });

    button.classList.add("selected");
    selectedDate = dateKey;
    currentHoldId = null;
    reservationConfirmed = false;
    document.getElementById("reservationForm").reset();
    document.getElementById("reservationMessage").textContent = "";
    document.getElementById("confirmButton").hidden = true;
    document.getElementById("cancelButton").hidden = true;

    document.getElementById("selectedDate").textContent =
        new Date(`${dateKey}T00:00:00`).toLocaleDateString("ja-JP") + " の予約";

    document.getElementById("formArea").style.display = "block";
}

document.getElementById("reservationForm").onsubmit = async function(e) {
    e.preventDefault();
    if (!selectedDate || currentHoldId !== null || reservationConfirmed) return;

    const message = document.getElementById("reservationMessage");
    message.classList.remove("error");
    message.textContent = "仮押さえを作成しています。";

    try {
        const response = await fetch("/api/holds", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                child_id: Number(document.getElementById("childId").value),
                care_date: selectedDate,
                course: document.getElementById("time").value
            })
        });
        const result = await response.json();
        if (!response.ok) {
            throw new Error(result.error || "仮押さえを作成できませんでした。");
        }
        currentHoldId = result.reservation_id;
        message.textContent =
            `仮押さえしました。料金: ${result.fee_yen.toLocaleString()}円。内容を確認して確定してください。`;
        document.getElementById("confirmButton").hidden = false;
        document.getElementById("cancelButton").hidden = false;
        renderCalendar();
    } catch (error) {
        message.textContent =
            error.message || "仮押さえを作成できませんでした。";
        message.classList.add("error");
    }
};

document.getElementById("confirmButton").onclick = async function() {
    if (currentHoldId === null) return;
    await updateHold(`/api/holds/${currentHoldId}/confirm`, "POST", "予約を確定しました。");
};

document.getElementById("cancelButton").onclick = async function() {
    if (currentHoldId === null) return;
    await updateHold(`/api/holds/${currentHoldId}`, "DELETE", "仮押さえを取り消しました。");
};

async function updateHold(url, method, successMessage) {
    const message = document.getElementById("reservationMessage");
    message.classList.remove("error");
    message.textContent = "予約情報を更新しています。";

    try {
        const response = await fetch(url, {method});
        const result = await response.json();
        if (!response.ok) {
            throw new Error(result.error || "予約情報を更新できませんでした。");
        }
        message.textContent = successMessage;
        reservationConfirmed = method === "POST";
        currentHoldId = null;
        document.getElementById("confirmButton").hidden = true;
        document.getElementById("cancelButton").hidden = true;
        renderCalendar();
    } catch (error) {
        message.textContent = error.message || "予約情報を更新できませんでした。";
        message.classList.add("error");
    }
}

renderCalendar();
</script>

</body>
</html>
