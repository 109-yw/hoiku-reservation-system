
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一時保育予約</title>

<style>
body {
    font-family: sans-serif;
    background: #f0f6fa;
    margin: 0;
}

header {
    background: #78b5d6;
    color: white;
    text-align: center;
    padding: 25px;
}

.container {
    max-width: 650px;
    margin: 30px auto;
    padding: 25px;
    background: white;
    border-radius: 12px;
}

.month {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

button {
    cursor: pointer;
    border: none;
    border-radius: 6px;
    padding: 10px 15px;
    background: #78b5d6;
    color: white;
}

button:hover {
    background: #559ac2;
}

.calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
}

.weekday {
    text-align: center;
    font-weight: bold;
    padding: 10px 0;
}

.day {
    min-height: 65px;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: white;
    color: #333;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    transition: 0.2s;
}

.day:hover:not(:disabled) {
    background: #dceefa;
    transform: translateY(-3px) scale(1.04);
    box-shadow: 0 4px 10px #0002;
}

.day.selected {
    background: #c5e5f7;
    border: 2px solid #559ac2;
}

.day:disabled {
    background: #f1f1f1;
    color: #aaa;
    cursor: not-allowed;
}

.status {
    font-size: 13px;
}

.open { color: green; }
.few { color: orange; }
.full { color: red; }
.closed { color: #777; }

.legend {
    text-align: center;
    margin: 20px 0;
}

.message {
    min-height: 1.5em;
    color: #333;
}

.message.error {
    color: #b00020;
}

.form-area {
    display: none;
    border-top: 1px solid #ddd;
    padding-top: 20px;
}

label {
    display: block;
    margin-top: 15px;
}

input, select {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    box-sizing: border-box;
}

#childrenList {
    border: 1px solid #c5d3dd;
    border-radius: 8px;
    padding: 12px 16px;
}

.child-option {
    display: flex;
    align-items: center;
    gap: 10px;
    width: fit-content;
    margin: 8px 0;
    cursor: pointer;
}

.child-checkbox {
    appearance: none;
    flex: 0 0 22px;
    position: relative;
    width: 22px;
    height: 22px;
    margin: 0;
    padding: 0;
    border: 2px solid #526b7c;
    border-radius: 4px;
    background: white;
    cursor: pointer;
}

.child-checkbox:checked {
    border-color: #256a9a;
    background-color: #256a9a;
}

.child-checkbox:checked::after {
    content: "";
    position: absolute;
    left: 6px;
    top: 1px;
    width: 5px;
    height: 11px;
    border: solid white;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
}

.child-checkbox:focus-visible {
    outline: 3px solid #91c9eb;
    outline-offset: 2px;
}

.reserve {
    width: 100%;
    margin-top: 25px;
    padding: 15px;
}

.reservation-result {
    margin-top: 12px;
    padding: 14px;
    border: 1px solid #c5d3dd;
    border-radius: 8px;
    background: #f7fbfd;
}

.reservation-result p {
    margin: 0 0 10px;
}

.reservation-result button {
    margin: 4px 8px 0 0;
}

.back {
    display: block;
    text-align: center;
    margin-top: 25px;
    color: #559ac2;
}
</style>
</head>

<body>

<header>
    <h1>一時保育予約システム</h1>
    <p>予約画面</p>
</header>

<div class="container">

    <h2>利用希望日を選択</h2>

    <div class="month">
        <button onclick="changeMonth(-1)">◀ 前月</button>
        <h2 id="monthTitle"></h2>
        <button onclick="changeMonth(1)">翌月 ▶</button>
        </div>

        <p id="calendarMessage" class="message" aria-live="polite"></p>
        <div class="calendar" id="calendar"></div>

        <div class="legend">
            <span class="open">○ 空きあり</span>　
            <span class="few">△ 残りわずか</span>　
            <span class="full">× 満員</span>　
            <span class="closed">休 開所情報なし・休所</span>
        </div>

    
<div class="form-area" id="formArea">

        <h2 id="selectedDate"></h2>
        <p>お子様と利用時間を選択してください。</p>

        <form id="reservationForm">

            <fieldset id="childrenList">
                <legend>お子様</legend>
                <p id="childrenMessage" class="message">お子様情報を読み込んでいます。</p>
            </fieldset>
            

            <label for="time">利用時間</label>
            <select id="time" required>
                <option value="">選択してください</option>
                <option value="morning">9:00～13:00（午前）</option>
                <option value="afternoon">13:00～17:00（午後）</option>
                <option value="full_day">9:00～17:00（一日）</option>
            </select>

            <button type="submit" class="reserve">予約確定</button>

        </form>
        <p id="reservationMessage" class="message" aria-live="polite"></p>
        <div id="reservationResults" aria-live="polite"></div>
</div>


    <a href="user_home.html" class="back">
        トップページに戻る
    </a>

</div>

<script>
const today = new Date();
today.setHours(0, 0, 0, 0);

let currentYear = today.getFullYear();
let currentMonth = today.getMonth();
let selectedDate = null;
let reservationsInProgress = false;
let reservationResults = [];
let monthDays = new Map();
let calendarRequestId = 0;

// カレンダーを表示
async function renderCalendar() {
    const requestId = ++calendarRequestId;
    const year = currentYear;
    const month = currentMonth;
    const calendar = document.getElementById("calendar");
    calendar.innerHTML = "";

    document.getElementById("monthTitle").textContent =
        `${year}年${month + 1}月`;
    const calendarMessage = document.getElementById("calendarMessage");
    calendarMessage.textContent = "空き状況を読み込んでいます。";
    calendarMessage.classList.remove("error");

    const weekdays = ["日", "月", "火", "水", "木", "金", "土"];

    weekdays.forEach(w => {
        const div = document.createElement("div");
        div.className = "weekday";
        div.textContent = w;
        calendar.appendChild(div);
    });

    const firstDay = new Date(year, month, 1).getDay();

    for (let i = 0; i < firstDay; i++) {
        calendar.appendChild(document.createElement("div"));
    }

    try {
        const response = await fetch(
            `/api/availability/month?year=${year}&month=${month + 1}`
        );
        const result = await response.json();
        if (!response.ok) {
            throw new Error(result.error || "空き状況を取得できませんでした。");
        }
        if (requestId !== calendarRequestId) return;
        monthDays = new Map(result.days.map(day => [day.care_date, day]));
        calendarMessage.textContent = "";
    } catch (error) {
        if (requestId !== calendarRequestId) return;
        monthDays = new Map();
        calendarMessage.textContent =
            error.message || "空き状況を取得できませんでした。";
        calendarMessage.classList.add("error");
    }

    const lastDay = new Date(year, month + 1, 0).getDate();
    for (let day = 1; day <= lastDay; day++) {
        const date = new Date(year, month, day);
        const dateKey = [
            year,
            String(month + 1).padStart(2, "0"),
            String(day).padStart(2, "0")
        ].join("-");
        const dayInfo = monthDays.get(dateKey);
        const status = dayInfo ? dayInfo.status : "closed";

        const btn = document.createElement("button");
        btn.className = "day";
        btn.type = "button";

        const number = document.createElement("span");
        number.textContent = day;

        const mark = document.createElement("span");
        mark.className = "status " + status;
        mark.textContent = status === "full" ? "×" :
            status === "few" ? "△" :
            status === "open" ? "○" : "休";

        btn.appendChild(number);
        btn.appendChild(mark);

        if (date < today || !dayInfo || status === "closed" || status === "full"
                || hasPendingReservations() || reservationsInProgress) {
            btn.disabled = true;
        } else {
            btn.onclick = () => selectDate(dateKey, btn);
        }

        calendar.appendChild(btn);
    }
}

// 月を切り替える
function changeMonth(value) {
    if (hasPendingReservations() || reservationsInProgress) return;
    const date = new Date(currentYear, currentMonth + value, 1);
    currentYear = date.getFullYear();
    currentMonth = date.getMonth();

    selectedDate = null;
    document.getElementById("formArea").style.display = "none";
    document.getElementById("reservationForm").reset();
    document.getElementById("reservationMessage").textContent = "";
    document.getElementById("reservationResults").replaceChildren();
    reservationResults = [];

    renderCalendar();
}

// 日付を選択
function selectDate(dateKey, button) {
    document.querySelectorAll(".day").forEach(btn => {
        btn.classList.remove("selected");
    });

    button.classList.add("selected");
    selectedDate = dateKey;
    document.getElementById("reservationForm").reset();
    document.getElementById("reservationMessage").textContent = "";
    document.getElementById("reservationResults").replaceChildren();
    reservationResults = [];

    document.getElementById("selectedDate").textContent =
        new Date(`${dateKey}T00:00:00`).toLocaleDateString("ja-JP") + " の予約";

    document.getElementById("formArea").style.display = "block";
}

async function loadChildren() {
    const list = document.getElementById("childrenList");
    const message = document.getElementById("childrenMessage");
    try {
        const response = await fetch("/api/children");
        const result = await response.json();
        if (!response.ok) {
            throw new Error(result.error || "お子様情報を取得できませんでした。");
        }
        message.remove();
        if (result.children.length === 0) {
            list.insertAdjacentHTML("beforeend", "<p>予約可能なお子様が登録されていません。</p>");
            return;
        }
        result.children.forEach(child => {
            const label = document.createElement("label");
            label.className = "child-option";
            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.name = "childId";
            checkbox.value = child.child_id;
            checkbox.className = "child-checkbox";
            label.append(checkbox, document.createTextNode(` ${child.name}`));
            list.appendChild(label);
        });
    } catch (error) {
        message.textContent = error.message || "お子様情報を取得できませんでした。";
        message.classList.add("error");
    }
}

document.getElementById("reservationForm").onsubmit = async function(e) {
    e.preventDefault();
    if (!selectedDate || reservationsInProgress || hasPendingReservations()) return;

    const selectedChildren = Array.from(
        document.querySelectorAll('input[name="childId"]:checked')
    );
    if (selectedChildren.length === 0) {
        const errorMessage = document.getElementById("reservationMessage");
        errorMessage.textContent = "予約するお子様を選択してください。";
        errorMessage.classList.add("error");
        return;
    }

    const message = document.getElementById("reservationMessage");
    message.classList.remove("error");
    message.textContent = "選択したお子様の予約を順番に作成しています。";
    reservationsInProgress = true;
    const submitButton = document.querySelector("#reservationForm button[type='submit']");
    submitButton.disabled = true;
    reservationResults = [];

    try {
        for (const checkbox of selectedChildren) {
            const childName = checkbox.parentElement.textContent.trim();
            try {
                const response = await fetch("/api/holds", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({
                        child_id: Number(checkbox.value),
                        care_date: selectedDate,
                        course: document.getElementById("time").value
                    })
                });
                const result = await response.json();
                if (!response.ok) {
                    throw new Error(result.error || "予約を作成できませんでした。");
                }
                reservationResults.push({
                    childName,
                    reservationId: result.reservation_id,
                    status: result.status,
                    feeYen: result.fee_yen,
                    error: null
                });
            } catch (error) {
                reservationResults.push({
                    childName,
                    status: "error",
                    error: error.message || "予約を作成できませんでした。"
                });
            }
        }
        renderReservationResults();
        const heldCount = reservationResults.filter(item => item.status === "held").length;
        const waitlistedCount = reservationResults.filter(item => item.status === "waitlisted").length;
        const errorCount = reservationResults.filter(item => item.status === "error").length;
        message.textContent =
            `処理結果：仮押さえ ${heldCount}人、キャンセル待ち ${waitlistedCount}人、エラー ${errorCount}人。` +
            (heldCount > 0 ? "仮押さえごとに予約を確定してください。" : "");
    } finally {
        reservationsInProgress = false;
        submitButton.disabled = false;
    }
    renderCalendar();
};

function hasPendingReservations() {
    return reservationResults.some(item =>
        item.status === "held" || item.status === "waitlisted"
    );
}

function renderReservationResults() {
    const container = document.getElementById("reservationResults");
    container.replaceChildren();

    reservationResults.forEach((item, index) => {
        const card = document.createElement("div");
        card.className = "reservation-result";
        const details = document.createElement("p");
        details.textContent = `${item.childName}：${
            item.status === "held" ? `仮押さえ中（${item.feeYen.toLocaleString()}円）` :
            item.status === "waitlisted" ? "キャンセル待ち登録済み" :
            item.status === "confirmed" ? "予約確定済み" :
            item.status === "cancelled" ? "キャンセル済み" :
            `エラー（${item.error}）`
        }`;
        card.appendChild(details);

        if (item.status === "held") {
            const confirmButton = document.createElement("button");
            confirmButton.type = "button";
            confirmButton.textContent = "この予約を確定";
            confirmButton.onclick = () => updateReservation(index, "confirm");
            const cancelButton = document.createElement("button");
            cancelButton.type = "button";
            cancelButton.textContent = "仮押さえを取消";
            cancelButton.onclick = () => updateReservation(index, "cancel");
            card.append(confirmButton, cancelButton);
        } else if (item.status === "waitlisted") {
            const cancelButton = document.createElement("button");
            cancelButton.type = "button";
            cancelButton.textContent = "キャンセル待ちを取消";
            cancelButton.onclick = () => updateReservation(index, "cancel");
            card.appendChild(cancelButton);
        }
        container.appendChild(card);
    });
}

async function updateReservation(index, action) {
    const item = reservationResults[index];
    if (!item || !item.reservationId) return;
    const url = action === "confirm"
        ? `/api/holds/${item.reservationId}/confirm`
        : `/api/holds/${item.reservationId}`;
    const method = action === "confirm" ? "POST" : "DELETE";

    try {
        const response = await fetch(url, {method});
        const result = await response.json();
        if (!response.ok) {
            throw new Error(result.error || "予約情報を更新できませんでした。");
        }
        item.status = action === "confirm" ? "confirmed" : "cancelled";
        renderReservationResults();
        document.getElementById("reservationMessage").textContent =
            action === "confirm" ? `${item.childName}の予約を確定しました。` :
            `${item.childName}の予約をキャンセルしました。`;
        renderCalendar();
    } catch (error) {
        document.getElementById("reservationMessage").textContent =
            error.message || "予約情報を更新できませんでした。";
        document.getElementById("reservationMessage").classList.add("error");
    }
}

loadChildren();
renderCalendar();
</script>

</body>
</html>
