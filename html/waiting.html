
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>キャンセル待ち申請</title>

<style>
body {
    font-family: sans-serif;
    background: #f0f6fa;
    margin: 0;
}

header {
    background: #78b5d6;
    color: white;
    text-align: center;
    padding: 25px;
}

.container {
    max-width: 650px;
    margin: 30px auto;
    padding: 25px;
    background: white;
    border-radius: 12px;
}

.month {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

button {
    cursor: pointer;
    border: none;
    border-radius: 6px;
    padding: 10px 15px;
    background: #78b5d6;
    color: white;
}

button:hover:not(:disabled) {
    background: #559ac2;
}

.calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
}

.weekday {
    text-align: center;
    font-weight: bold;
    padding: 10px 0;
}

.day {
    min-height: 65px;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: white;
    color: #333;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    transition: 0.2s;
}

.day:hover:not(:disabled) {
    background: #dceefa;
    transform: translateY(-3px) scale(1.04);
    box-shadow: 0 4px 10px #0002;
}

.day.selected {
    background: #c5e5f7;
    border: 2px solid #559ac2;
}

.day:disabled {
    background: #f1f1f1;
    color: #aaa;
    cursor: not-allowed;
}

.status {
    font-size: 13px;
}

.open { color: green; }
.few { color: orange; }
.full { color: red; }
.closed { color: #777; }

.legend {
    text-align: center;
    margin: 20px 0;
}

.message {
    min-height: 1.5em;
    color: #333;
}

.message.error {
    color: #b00020;
}

.form-area {
    display: none;
    border-top: 1px solid #ddd;
    padding-top: 20px;
}

label {
    display: block;
    margin-top: 15px;
}

input, select {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    box-sizing: border-box;
}

#childrenList {
    border: 1px solid #c5d3dd;
    border-radius: 8px;
    padding: 12px 16px;
}

.child-option {
    display: flex;
    align-items: center;
    gap: 10px;
    width: fit-content;
    margin: 8px 0;
    cursor: pointer;
}

.child-checkbox {
    appearance: none;
    flex: 0 0 22px;
    position: relative;
    width: 22px;
    height: 22px;
    margin: 0;
    padding: 0;
    border: 2px solid #526b7c;
    border-radius: 4px;
    background: white;
    cursor: pointer;
}

.child-checkbox:checked {
    border-color: #256a9a;
    background-color: #256a9a;
}

.child-checkbox:checked::after {
    content: "";
    position: absolute;
    left: 6px;
    top: 1px;
    width: 5px;
    height: 11px;
    border: solid white;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
}

.child-checkbox:focus-visible {
    outline: 3px solid #91c9eb;
    outline-offset: 2px;
}

.reserve {
    width: 100%;
    margin-top: 25px;
    padding: 15px;
}

.back {
    display: block;
    text-align: center;
    margin-top: 25px;
    color: #559ac2;
}
</style>
</head>

<body>

<header>
    <h1>一時保育予約システム</h1>
    <p>キャンセル待ち申請画面</p>
</header>

<div class="container">

    <h2>キャンセル待ち希望日を選択</h2>

    <div class="month">
        <button type="button" onclick="changeMonth(-1)">
            ◀ 前月
        </button>

        <h2 id="monthTitle"></h2>

        <button type="button" onclick="changeMonth(1)">
            翌月 ▶
        </button>
    </div>

    <p id="calendarMessage"
       class="message"
       aria-live="polite"></p>

    <div class="calendar" id="calendar"></div>

    <div class="legend">
        <span class="open">○ 空きあり</span>　
        <span class="few">△ 残りわずか</span>　
        <span class="full">× 満員</span>　
        <span class="closed">休 開所情報なし・休所</span>
    </div>

    <p class="message">
        ※満員（×）の日付のみキャンセル待ちを申請できます。
    </p>

    <div class="form-area" id="formArea">

        <h2 id="selectedDate"></h2>

        <p>お子様と希望利用時間を選択してください。</p>

        <form id="waitingForm">

            <fieldset id="childrenList">
                <legend>お子様</legend>
                <p id="childrenMessage" class="message">お子様情報を読み込んでいます。</p>
            </fieldset>

            <label for="time">希望利用時間</label>
            <select id="time" required>
                <option value="">選択してください</option>
                <option value="morning">
                    9:00～13:00（午前）
                </option>
                <option value="afternoon">
                    13:00～17:00（午後）
                </option>
                <option value="full_day">
                    9:00～17:00（一日）
                </option>
            </select>

            <button type="submit" class="reserve">
                キャンセル待ちを申請
            </button>

        </form>

        <p id="waitingMessage"
           class="message"
           aria-live="polite"></p>

    </div>

    <a href="user_home.html" class="back">
        トップページに戻る
    </a>

</div>

<script>
const today = new Date();
today.setHours(0, 0, 0, 0);

let currentYear = today.getFullYear();
let currentMonth = today.getMonth();
let selectedDate = null;
let monthDays = new Map();
let calendarRequestId = 0;

// カレンダー表示
async function renderCalendar() {
    const requestId = ++calendarRequestId;
    const year = currentYear;
    const month = currentMonth;

    const calendar = document.getElementById("calendar");
    calendar.innerHTML = "";

    document.getElementById("monthTitle").textContent =
        `${year}年${month + 1}月`;

    const calendarMessage =
        document.getElementById("calendarMessage");

    calendarMessage.textContent =
        "空き状況を読み込んでいます。";

    calendarMessage.classList.remove("error");

    const weekdays =
        ["日", "月", "火", "水", "木", "金", "土"];

    weekdays.forEach(w => {
        const div = document.createElement("div");
        div.className = "weekday";
        div.textContent = w;
        calendar.appendChild(div);
    });

    const firstDay =
        new Date(year, month, 1).getDay();

    for (let i = 0; i < firstDay; i++) {
        calendar.appendChild(
            document.createElement("div")
        );
    }

    let loaded = false;

    try {
        const response = await fetch(
            `/api/availability/month?year=${year}&month=${month + 1}`
        );

        const result = await response.json();

        if (!response.ok) {
            throw new Error(
                result.error || "空き状況を取得できませんでした。"
            );
        }

        if (requestId !== calendarRequestId) return;

        monthDays = new Map(
            result.days.map(day => [day.care_date, day])
        );

        calendarMessage.textContent = "";
        loaded = true;

    } catch (error) {
        if (requestId !== calendarRequestId) return;

        monthDays = new Map();

        calendarMessage.textContent =
            error.message || "空き状況を取得できませんでした。";

        calendarMessage.classList.add("error");
    }

    const lastDay =
        new Date(year, month + 1, 0).getDate();

    for (let day = 1; day <= lastDay; day++) {
        const date = new Date(year, month, day);

        const dateKey = [
            year,
            String(month + 1).padStart(2, "0"),
            String(day).padStart(2, "0")
        ].join("-");

        const dayInfo = monthDays.get(dateKey);

        const status =
            dayInfo ? dayInfo.status : "closed";

        const btn = document.createElement("button");
        btn.className = "day";
        btn.type = "button";

        const number = document.createElement("span");
        number.textContent = day;

        const mark = document.createElement("span");
        mark.className = "status " + status;

        mark.textContent =
            status === "full" ? "×" :
            status === "few" ? "△" :
            status === "open" ? "○" : "休";

        btn.appendChild(number);
        btn.appendChild(mark);

        // 満員の日付だけ選択可能
        if (
            date < today ||
            !loaded ||
            !dayInfo ||
            status !== "full"
        ) {
            btn.disabled = true;
        } else {
            btn.onclick = () => selectDate(dateKey, btn);
        }

        calendar.appendChild(btn);
    }
}

// 月の切り替え
function changeMonth(value) {
    const date =
        new Date(currentYear, currentMonth + value, 1);

    currentYear = date.getFullYear();
    currentMonth = date.getMonth();

    selectedDate = null;

    document.getElementById("formArea").style.display =
        "none";

    document.getElementById("waitingForm").reset();

    document.getElementById("waitingMessage").textContent =
        "";

    renderCalendar();
}

// 日付選択
function selectDate(dateKey, button) {
    document.querySelectorAll(".day").forEach(btn => {
        btn.classList.remove("selected");
    });

    button.classList.add("selected");
    selectedDate = dateKey;

    document.getElementById("waitingForm").reset();

    document.getElementById("waitingMessage").textContent =
        "";

    document.getElementById("selectedDate").textContent =
        new Date(`${dateKey}T00:00:00`)
            .toLocaleDateString("ja-JP") +
        " のキャンセル待ち申請";

    document.getElementById("formArea").style.display =
        "block";
}

async function loadChildren() {
    const list = document.getElementById("childrenList");
    const message = document.getElementById("childrenMessage");
    try {
        const response = await fetch("/api/children");
        const result = await response.json();
        if (!response.ok) {
            throw new Error(result.error || "お子様情報を取得できませんでした。");
        }
        message.remove();
        if (result.children.length === 0) {
            list.insertAdjacentHTML("beforeend", "<p>予約可能なお子様が登録されていません。</p>");
            return;
        }
        result.children.forEach(child => {
            const label = document.createElement("label");
            label.className = "child-option";
            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.name = "childId";
            checkbox.value = child.child_id;
            checkbox.className = "child-checkbox";
            label.append(checkbox, document.createTextNode(` ${child.name}`));
            list.appendChild(label);
        });
    } catch (error) {
        message.textContent = error.message || "お子様情報を取得できませんでした。";
        message.classList.add("error");
    }
}

// 申請内容の確認・保存
document.getElementById("waitingForm").onsubmit =
async function(e) {
    e.preventDefault();

    if (!selectedDate) return;

    const selectedChildren = Array.from(
        document.querySelectorAll('input[name="childId"]:checked')
    );
    if (selectedChildren.length !== 1) {
        document.getElementById("waitingMessage").textContent =
            "お子様を1人選択してください。";
        return;
    }
    const childId = Number(selectedChildren[0].value);

    const time =
        document.getElementById("time");

    const timeText =
        time.options[time.selectedIndex].text.trim();

    const message =
        "以下の内容でキャンセル待ちを申請しますか？\n\n" +
        "希望日：" + selectedDate + "\n" +
        "児童ID：" + childId + "\n" +
        "利用時間：" + timeText;

    if (!confirm(message)) return;

    const waitingMessage = document.getElementById("waitingMessage");
    waitingMessage.classList.remove("error");
    waitingMessage.textContent = "キャンセル待ちを登録しています。";
    try {
        const response = await fetch("/api/holds", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                child_id: childId,
                care_date: selectedDate,
                course: time.value
            })
        });
        const result = await response.json();
        if (!response.ok) {
            throw new Error(result.error || "キャンセル待ちを登録できませんでした。");
        }
        if (result.status !== "waitlisted") {
            await fetch(`/api/holds/${result.reservation_id}`, {method: "DELETE"});
            throw new Error("選択した時間帯に空きができています。通常の予約画面からお申し込みください。");
        }
        waitingMessage.textContent =
            "キャンセル待ちを登録しました。空きが出た場合は、優先ポイント順にオファーをメールでお知らせします。";
    } catch (error) {
        waitingMessage.textContent = error.message || "キャンセル待ちを登録できませんでした。";
        waitingMessage.classList.add("error");
    }
};

loadChildren();
renderCalendar();
</script>

</body>
</html>
